# Development and test runs use throwaway data directories: allow the plaintext vault key next to
# the SQLite ciphertext there. dash refuses that layout by default (spec 5.2); installations set
# DASH_VAULT_PASSPHRASE, DASH_MASTER_KEY or DASH_MASTER_KEY_FILE instead. Cargo's [env] also
# reaches `cargo run`, so this opt-in only covers data directories inside the system temporary
# directory (test TempDirs): serving a real data directory from source still gets the refusal.
# An explicit value in the environment wins.
[env]
DASH_ALLOW_COLOCATED_VAULT_KEY_IN_TEMP = { value = "1", force = false }
